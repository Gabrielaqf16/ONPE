<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avance de Colección</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 Avance de la Colección</h1>
    <p>Clasificación e indexación general, ONPE y No ONPE</p>
  </header>

  <main>
    <section id="general" class="card">
      <h2>📊 Colección General</h2>
      <div id="tabla-general"></div>
    </section>

    <section id="onpe" class="card">
      <h2>🏛️ Colección ONPE</h2>
      <div id="tabla-onpe-resumen"></div>
      <h3>📅 Avance por año</h3>
      <div id="tabla-onpe-anos"></div>
    </section>

    <section id="no-onpe" class="card">
      <h2>🏫 Colección NO ONPE</h2>
      <div id="tabla-noonpe-resumen"></div>
      <h3>🏢 Avance por institución</h3>
      <div id="tabla-noonpe-inst"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Oficina Nacional de Procesos Electorales (ONPE)</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
